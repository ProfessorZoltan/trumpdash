<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trump Dash</title>
<script>
  // Cache busting. Bump TD_VERSION whenever a JS/CSS file changes so browsers never mix old and
  // new modules. On localhost every load gets a fresh stamp so local edits always show up.
  window.TD_VERSION = '8';
  (function () {
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var v = local ? String(Date.now()) : window.TD_VERSION;
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'style.css?v=' + v;
    document.head.appendChild(css);
    var files = [
      'src/constants.js', 'src/sprites.js', 'src/level.js',
      'src/levels/greenland.js', 'src/levels/venezuela.js', 'src/levels/hormuz.js', 'src/levels/canada.js', 'src/levels/panama.js',
      'src/physics.js', 'src/audio.js', 'src/render.js', 'src/game.js',
    ];
    window.addEventListener('DOMContentLoaded', function () {
      files.forEach(function (f) {
        var s = document.createElement('script');
        s.src = f + '?v=' + v;
        s.async = false; // keep execution order
        document.body.appendChild(s);
      });
    });
  })();
</script>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>
</body>
</html>
