<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trump Dash</title>
<meta name="description" content="Trump Dash: a Geometry Dash-style parody rhythm platformer. Run, jump, annex, stay on the beat.">
<meta name="theme-color" content="#05060f">
<!-- Home-screen install: landscape, no browser chrome (manifest.json for Android/Chrome, the apple-* tags for iOS) -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trump Dash">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Trump Dash">
<meta property="og:description" content="A Geometry Dash-style parody rhythm platformer. Run, jump, annex, stay on the beat.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.trumpdash.com/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Cloudflare Web Analytics (cookieless visit counting; the domain is DNS-only, so the beacon is added here by hand) -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5954b93834144fc8b31055bc0b13a5f2"}'></script>
<script>
  // Cache busting. Bump TD_VERSION whenever a JS/CSS file changes so browsers never mix old and
  // new modules. On localhost every load gets a fresh stamp so local edits always show up.
  window.TD_VERSION = '16';
  (function () {
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var v = local ? String(Date.now()) : window.TD_VERSION;
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'style.css?v=' + v;
    document.head.appendChild(css);
    var files = [
      'src/constants.js', 'src/sprites.js', 'src/level.js',
      'src/levels/greenland.js', 'src/levels/venezuela.js', 'src/levels/hormuz.js', 'src/levels/canada.js', 'src/levels/panama.js', 'src/levels/moon.js', 'src/levels/qatar.js',
      'src/physics.js', 'src/audio.js', 'src/render.js', 'src/game.js',
    ];
    window.addEventListener('DOMContentLoaded', function () {
      files.forEach(function (f) {
        var s = document.createElement('script');
        s.src = f + '?v=' + v;
        s.async = false; // keep execution order
        document.body.appendChild(s);
      });
    });
    // Offline support for the installed app. sw.js is network-first, so online players always get the
    // latest deploy. On localhost it is only registered with ?sw=1, and ?nosw=1 removes it anywhere.
    if ('serviceWorker' in navigator) {
      var q = location.search;
      if (/[?&]nosw=1/.test(q)) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      else if (!local || /[?&]sw=1/.test(q)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  })();
</script>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>
<div id="rotate">
  <div class="phone"></div>
  <h1>ROTATE YOUR PHONE</h1>
  <p>Trump Dash plays in landscape.</p>
  <button id="rotate-fs" type="button">GO FULLSCREEN</button>
</div>
</body>
</html>
